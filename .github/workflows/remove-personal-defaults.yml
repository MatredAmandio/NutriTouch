name: Remove personal default data

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '.github/workflows/remove-personal-defaults.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sanitize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove seeded personal profile data
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = "let d=JSON.parse(localStorage.getItem('nutritouch_profile')||'null')||{age:45,sex:'female',weight:57,height:159,goal:'recomp',resistance:'yes',target:53,deadline:'dezembro',activity:'moderate',meals:4,trainingFreq:5,trainingType:'resistance',trainingMin:60,steps:7000,occupation:'mixed',cook:'moderate',preferences:'',avoid:'',allergies:'',gi:'no',intolerance:'none',condition:'none'};"
          new = "const EMPTY_PROFILE={age:'',sex:'',weight:'',height:'',goal:'',resistance:'',target:'',deadline:'',activity:'',meals:'',trainingFreq:'',trainingType:'',trainingMin:'',steps:'',occupation:'',cook:'',preferences:'',avoid:'',allergies:'',gi:'',intolerance:'',condition:''};\nconst savedProfile=JSON.parse(localStorage.getItem('nutritouch_profile')||'null');\nlet d=savedProfile||{...EMPTY_PROFILE};"
          if old in s:
              s = s.replace(old, new, 1)
          else:
              raise SystemExit('Expected seeded profile block was not found; no changes made.')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit sanitized app
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'fix: remove personal data from app defaults'
          git push
