name: NutriTouch mobile UI (legacy validation)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate current application files
        run: |
          test -f index.html
          test -f menu7.js
          test -f foodbridge.js
          echo "Legacy mobile UI workflow disabled. Current UI is maintained directly in the application source."
