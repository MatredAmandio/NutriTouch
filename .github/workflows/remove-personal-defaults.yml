name: Android touch fix

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '.github/workflows/remove-personal-defaults.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Android controls
        run: |
          python -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(encoding='utf-8'); s=s.replace('button{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}', 'button{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-appearance:none;appearance:none;pointer-events:auto;position:relative;z-index:10}'); s=s.replace(\"document.addEventListener('touchend',function(e){\", \"document.addEventListener('pointerup',function(e){\\n    if(e.pointerType==='mouse')return;\"); p.write_text(s,encoding='utf-8')"
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'fix: switch Android taps to pointer events'
          git push
