name: NutriTouch V16 mobile visual audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Start local app
        run: |
          python3 -m http.server 4173 >/tmp/nutritouch-http.log 2>&1 &
          echo $! > /tmp/nutritouch-http.pid
          sleep 1
      - name: Run visual and mobile audit
        run: timeout 90s node tests/v16-mobile-visual-audit.mjs
      - name: Upload audit screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v16-mobile-visual-audit
          path: audit-artifacts/
          if-no-files-found: warn
